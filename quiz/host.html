<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz — Live Results</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/deck.css">
<style>
body{overflow:auto}
.wrap{max-width:1300px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 50px;position:relative;z-index:5}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:clamp(23px,3vw,38px);letter-spacing:-.03em;margin:0}
.live{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--green);
  border:1px solid rgba(63,185,80,.4);border-radius:99px;padding:5px 12px}
.live i{width:7px;height:7px;border-radius:99px;background:var(--green);animation:blink 1.1s infinite}
.tools{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
.tools .btn{font-size:12.5px;padding:8px 14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel)}
.kpi b{display:block;font-size:clamp(24px,3.2vw,38px);font-weight:900;letter-spacing:-.03em;color:var(--blue)}
.kpi span{font-size:12px;color:var(--dim)}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
h3.k{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:0 0 11px;font-family:var(--mono)}
.lb{display:grid;gap:8px}
.lbrow{display:grid;grid-template-columns:44px 1fr auto auto;gap:14px;align-items:center;
  border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--panel);transition:.3s}
.lbrow.top{border-color:var(--green);background:linear-gradient(90deg,rgba(63,185,80,.12),var(--panel))}
.lbrow .r{font-size:19px;text-align:center}
.lbrow .nm{font-weight:600;font-size:clamp(14px,1.5vw,18px)}
.lbrow .meta{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.lbrow .sc{font-family:var(--mono);font-size:clamp(16px,2vw,23px);font-weight:700;color:var(--green)}
.prg{grid-column:2/-1;height:4px;border-radius:99px;background:#161b22;overflow:hidden;margin-top:2px}
.prg i{display:block;height:100%;background:var(--blue);transition:width .5s}
.qlist{display:grid;gap:7px;max-height:64vh;overflow:auto;padding-right:4px}
.qrow{border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:var(--panel);font-size:13px}
.qrow .t{display:flex;gap:9px;align-items:baseline}
.qrow .id{font-family:var(--mono);color:var(--dim);flex:0 0 auto}
.qrow .txt{color:var(--dim);line-height:1.4}
.acc{height:8px;border-radius:99px;background:#1a212b;overflow:hidden;margin-top:8px;display:flex}
.acc i{display:block;height:100%;transition:width .5s}
.acc .ok{background:var(--green)}.acc .no{background:var(--red);opacity:.65}
.qrow .pct{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
.feed{display:grid;gap:6px}
.fd{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;font-family:var(--mono);
  font-size:12.5px;color:var(--dim);border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--panel)}
.fd .ic{font-size:13px}
.fd .pt{color:var(--green)}
.fd.miss .pt{color:var(--red)}
.feed .empty2{color:var(--dim);font-size:13px;font-family:var(--mono);padding:8px 2px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--dim)}
.empty b{display:block;font-size:18px;color:var(--tx);margin-bottom:6px}
@media(max-width:900px){.grid,.kpis{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
  <div class="head">
    <h1>🏆 Live results</h1>
    <span class="live"><i></i> LIVE · <span id="sessLabel">—</span></span>
    <div class="tools">
      <a class="btn ghost" href="index.html">Play</a>
      <a class="btn ghost" href="../">Deck</a>
      <button class="btn ghost" id="exp">Export results (JSON)</button>
      <button class="btn" id="newS">New session</button>
    </div>
  </div>

  <p id="syncMsg" class="sub" style="font-size:12.5px;margin:0 0 14px;font-family:var(--mono)"></p>

  <div class="kpis">
    <div class="kpi"><b id="kPlayers">0</b><span>players</span></div>
    <div class="kpi"><b id="kAnswers">0</b><span>answers submitted</span></div>
    <div class="kpi"><b id="kAcc">0%</b><span>room accuracy</span></div>
    <div class="kpi"><b id="kTop">—</b><span>leader</span></div>
  </div>

  <div class="grid">
    <div>
      <h3 class="k">Leaderboard</h3>
      <div class="lb" id="lb"></div>
      <h3 class="k" style="margin-top:22px">Live feed</h3>
      <div class="feed" id="feed"></div>
    </div>
    <div>
      <h3 class="k">Question breakdown</h3>
      <div class="qlist" id="ql"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="module">
import * as API from './api.js';

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const say = (m, bad) => { const el = $('#syncMsg'); el.textContent = m; el.style.color = bad ? 'var(--red)' : 'var(--dim)'; };

let seen = new Set(), seenFeed = new Set(), last = null, QUESTIONS = [];

try { QUESTIONS = await API.questions(); }
catch (err) { say(err.message, true); }

await tick();
setInterval(tick, 1500);          // ponytail: polling. SSE needs a long-lived PHP process

async function tick() {
  try {
    const st = await API.state();
    render(st);
    say(`Live · ${st.session.label} · updated ${new Date().toLocaleTimeString()}`);
  } catch (err) { say(err.message, true); }
}

$('#newS').onclick = async () => {
  const key = prompt('Host key (set as host_key in api/config.php) — starts a fresh session:');
  if (!key) return;
  try {
    await API.reset(key);
    seen = new Set(); seenFeed = new Set();
    await tick();
  } catch (err) { say(err.message, true); }
};

$('#exp').onclick = async () => {
  const st = await API.state();
  const url = URL.createObjectURL(new Blob([JSON.stringify(st, null, 2)], { type: 'application/json' }));
  Object.assign(document.createElement('a'),
    { href: url, download: `quiz-${new Date().toISOString().slice(0, 10)}.json` }).click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
};

function render(st) {
  const sig = JSON.stringify([st.board, st.feed.map(f => f.id)]);
  if (sig === last) return;                     // nothing changed, leave the DOM alone
  last = sig;

  $('#sessLabel').textContent = st.session.label;
  const answers = st.perQ.reduce((n, r) => n + +r.n, 0);
  const ok = st.perQ.reduce((n, r) => n + +r.ok, 0);
  $('#kPlayers').textContent = st.board.length;
  $('#kAnswers').textContent = answers;
  $('#kAcc').textContent = answers ? Math.round(ok / answers * 100) + '%' : '0%';
  $('#kTop').textContent = st.board[0]?.name ?? '—';

  $('#lb').innerHTML = st.board.length ? st.board.map((r, n) => `
    <div class="lbrow ${n === 0 ? 'top' : ''}" data-id="${r.id}">
      <span class="r">${['🥇', '🥈', '🥉'][n] ?? `<span class="meta">#${n + 1}</span>`}</span>
      <span class="nm">${esc(r.name)}</span>
      <span class="meta">${r.correct}/${st.total} · ${(r.avg_ms / 1000).toFixed(1)}s</span>
      <span class="sc">${r.score}</span>
      <span class="prg"><i style="width:${r.answered / st.total * 100}%"></i></span>
    </div>`).join('')
    : `<div class="empty"><b>No players yet</b>Share the quiz link — every phone writes to the same database, so scores land here as they answer.</div>`;

  if (!reduced) {
    const fresh = [...document.querySelectorAll('.lbrow')].filter(el => !seen.has(el.dataset.id));
    fresh.forEach(el => seen.add(el.dataset.id));
    gsap.fromTo(fresh, { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: .45, stagger: .05, ease: 'power3.out' });
  }

  $('#feed').innerHTML = st.feed.length ? st.feed.map(f => `
    <div class="fd ${+f.correct ? '' : 'miss'}" data-fid="${f.id}">
      <span class="ic">${+f.correct ? '✅' : '❌'}</span>
      <span>${esc(f.name)} answered Q${f.qid} in ${(f.ms / 1000).toFixed(1)}s</span>
      <span class="pt">+${f.points}</span>
    </div>`).join('')
    : '<div class="empty2">waiting for the first answer…</div>';

  if (!reduced) {
    const fresh = [...document.querySelectorAll('.fd')].filter(el => !seenFeed.has(el.dataset.fid));
    fresh.forEach(el => seenFeed.add(el.dataset.fid));
    gsap.fromTo(fresh, { autoAlpha: 0, y: -12, backgroundColor: 'rgba(88,166,255,.22)' },
      { autoAlpha: 1, y: 0, backgroundColor: 'rgba(13,17,23,1)', duration: .8, stagger: .04, ease: 'power2.out' });
  }

  const keyed = Object.fromEntries(st.correct.map(c => [c.id, c.c]));
  $('#ql').innerHTML = QUESTIONS.map(q => {
    const r = st.perQ.find(x => +x.qid === q.id) ?? { n: 0, ok: 0 };
    const pct = +r.n ? Math.round(r.ok / r.n * 100) : 0;
    const sp = st.spread[q.id] ?? [0, 0, 0, 0];
    return `<div class="qrow">
      <div class="t"><span class="id">Q${q.id} · ${q.d}</span><span class="txt">${esc(q.q)}</span></div>
      <div class="acc"><i class="ok" style="width:${pct}%"></i><i class="no" style="width:${+r.n ? 100 - pct : 0}%"></i></div>
      <div class="pct"><span>${+r.n} answered · ${pct}% correct</span>
        ${sp.map((n, k) => `<span style="color:${k === keyed[q.id] ? 'var(--green)' : 'inherit'}">${'ABCD'[k]}:${n}</span>`).join('')}</div>
    </div>`;
  }).join('');
}

/* background */
const bg = document.getElementById('bg'), bx = bg.getContext('2d');
let pts = [], W, H;
const sizeBg = () => {
  const d = devicePixelRatio || 1;
  W = bg.width = innerWidth * d; H = bg.height = innerHeight * d;
  bg.style.cssText = `position:fixed;inset:0;z-index:0;width:${innerWidth}px;height:${innerHeight}px`;
  pts = Array.from({ length: 30 }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .22 * d, vy: (Math.random() - .5) * .22 * d, r: (Math.random() * 1.5 + .6) * d }));
};
const draw = () => {
  bx.clearRect(0, 0, W, H);
  for (const p of pts) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > W) p.vx *= -1;
    if (p.y < 0 || p.y > H) p.vy *= -1;
    bx.beginPath(); bx.arc(p.x, p.y, p.r, 0, 7); bx.fillStyle = 'rgba(63,185,80,.4)'; bx.fill();
  }
  requestAnimationFrame(draw);
};
sizeBg(); addEventListener('resize', sizeBg); if (!reduced) draw();
</script>
</body>
</html>
